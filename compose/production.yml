# Produkce — doplňuje base.yml.
#
# Liší se hlavně tím, co se NEDĚLÁ: databáze nemá port ven.

services:
  postgresql:
    # Databáze je dostupná jen uvnitř sítě. Přístup zvenčí jde přes
    # `docker exec`, ne přes otevřený port.
    ports: []

  strapi:
    environment:
      NODE_ENV: production

  frontend:
    environment:
      NODE_ENV: production
