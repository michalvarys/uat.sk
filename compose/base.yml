# Společný základ pro všechna prostředí.
#
# Nespouští se sám — vždy v kombinaci s overlayem prostředí:
#   docker compose -f base.yml -f staging.yml ...
#
# Skripty v scripts/ to dělají za vás.
#
# HTTPS a směrování podle domén řeší nginx v aaPanelu. Kontejnery proto
# poslouchají jen na localhostu; do internetu je pouští až reverse proxy
# nastavená v panelu.

networks:
  internal:
    name: uat-${ENVIRONMENT}-internal

services:
  postgresql:
    image: bitnami/postgresql@sha256:09cdb3fa309b4e6d361f88975d0298d09cb88954cf01e8c0187df4341291fd43
    container_name: uat-${ENVIRONMENT}-db
    restart: unless-stopped
    environment:
      POSTGRESQL_USERNAME: ${POSTGRESQL_USER}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASS}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DB}
    volumes:
      - ${DATA_DIR}/db:/bitnami/postgresql
    networks:
      - internal
    healthcheck:
      # Ostatní služby čekají, až je databáze skutečně připravená —
      # bez toho Strapi při startu občas spadne na nedostupné spojení.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER} -d ${POSTGRESQL_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges=true

  strapi:
    image: ${BACKEND_IMAGE:-ghcr.io/michalvarys/uat-admin}:${BACKEND_TAG:-latest}
    container_name: uat-${ENVIRONMENT}-backend
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_NAME: ${POSTGRESQL_DB}
      DATABASE_HOST: postgresql
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${POSTGRESQL_USER}
      DATABASE_PASSWORD: ${POSTGRESQL_PASS}
      PORT: 1337
      HOST: 0.0.0.0
      # Strapi za reverse proxy musí znát svou veřejnou adresu, jinak
      # generuje odkazy na localhost (např. v administraci a e-mailech).
      URL: https://${BE_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      APP_KEYS: ${APP_KEYS}
      STRAPI_PLUGIN_I18N_INIT_LOCALE_CODE: sk
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ${DATA_DIR}/uploads:/opt/app/public/uploads
    ports:
      # Vázáno na 127.0.0.1 — port není dostupný zvenčí, jen pro nginx.
      - "127.0.0.1:${BE_PORT}:1337"
    networks:
      - internal
    depends_on:
      postgresql:
        condition: service_healthy
    security_opt:
      - no-new-privileges=true

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/michalvarys/uat-frontend}:${FRONTEND_TAG:-latest}
    container_name: uat-${ENVIRONMENT}-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Adresy se předávají za běhu, ne při buildu — díky tomu obslouží
      # tentýž image staging i produkci.
      #
      # Server volá Strapi vnitřní sítí Dockeru: je to stejné pro každé
      # prostředí, nezávisí to na doméně ani na certifikátu a provoz
      # neopouští stroj. Veřejná adresa zůstává jen pro odkazy
      # na obrázky, které skládá prohlížeč.
      API_URL: http://strapi:1337
      PUBLIC_API_URL: https://${BE_DOMAIN}
      BASE_URL: https://${FE_DOMAIN}/cms
      SITE_URL: https://${FE_DOMAIN}
      FRONTEND_DOMAIN: ${FE_DOMAIN}
      BACKEND_DOMAIN: ${BE_DOMAIN}
      API_TOKEN: ${API_TOKEN}
    ports:
      - "127.0.0.1:${FE_PORT}:3000"
    networks:
      - internal
    depends_on:
      - strapi
    security_opt:
      - no-new-privileges=true
