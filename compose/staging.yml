# Staging — doplňuje base.yml.
#
# Běží na stejném stroji jako produkce, oddělený jménem projektu,
# sítí a datovou složkou.

services:
  postgresql:
    # Port ven kvůli ladění a nahrávání záloh z lokálu.
    # Na produkci schválně chybí.
    ports:
      - "${POSTGRESQL_PORT:-5434}:5432"

  strapi:
    environment:
      NODE_ENV: production

  frontend:
    environment:
      NODE_ENV: production
    labels:
      # Staging nesmí do vyhledávačů — jinak by konkuroval produkci
      # duplicitním obsahem.
      - "traefik.http.middlewares.staging-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow"
      - "traefik.http.routers.staging-frontend.middlewares=staging-noindex,staging-auth"
      # Základní ochrana heslem, ať se na staging nedostane kdokoli.
      # Hash vygenerujete: htpasswd -nb uzivatel heslo
      - "traefik.http.middlewares.staging-auth.basicauth.users=${STAGING_AUTH:-}"
