# Staging — doplňuje base.yml.
#
# Běží na stejném stroji jako produkce, oddělený jménem projektu, sítí,
# datovou složkou a porty.
#
# Ochranu heslem a hlavičku noindex řeší nginx v aaPanelu, ne compose —
# viz docs/NGINX.md.

services:
  postgresql:
    # Port ven kvůli ladění a nahrávání záloh z lokálu.
    # Na produkci schválně chybí.
    ports:
      - "127.0.0.1:${POSTGRESQL_PORT:-5434}:5432"

  strapi:
    environment:
      NODE_ENV: production

  frontend:
    environment:
      NODE_ENV: production
